name: AudioControl
options:
  bundleIdPrefix: com.justinstrong
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  AudioControl:
    type: application
    platform: iOS
    sources:
      - path: AudioControl
    info:
      path: AudioControl/Info.plist
      properties:
        CFBundleDisplayName: AudioControl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: AudioControl uses Bluetooth to find and configure your nearby ESP32 audio processor and to connect developer tools to this iPhone.
        NSMicrophoneUsageDescription: Developer builds can record unprocessed audio when commanded from your paired Mac. Recordings are returned only to that nearby developer session.
        NSLocalNetworkUsageDescription: Developer builds connect to the AudioControl engineering tool on your nearby Mac.
        NSBonjourServices:
          - _ac-audio-dev._tcp
        UILaunchScreen: {}
    settings:
      base:
        DEVELOPMENT_TEAM: 3TKP8A48MF
        PRODUCT_BUNDLE_IDENTIFIER: com.justinstrong.AudioControl
        PRODUCT_NAME: AudioControl
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  AudioControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AudioControlTests
    dependencies:
      - target: AudioControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinstrong.AudioControlTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AudioControl:
    build:
      targets:
        AudioControl: all
        AudioControlTests: [test]
    test:
      targets:
        - AudioControlTests
